<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ex3 I-O 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{ --bg:#080b12; --panel:#0f141f; --panel2:#141b28; --edge:#243044; --ink:#e7eef7; --muted:#8697b0; --dim:#5a6a84;
    --gold:#ffc857; --e1:#ffd43b; --e2:#c084fc; --e3:#2dd4bf; --blue:#5b93ff; --red:#ff6b6b; }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:14px; display:flex; flex-direction:column; height:100vh; overflow:hidden; -webkit-font-smoothing:antialiased}
  .mono{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
  header{padding:11px 20px 9px; border-bottom:1px solid var(--edge); background:linear-gradient(180deg,var(--panel),var(--panel2))}
  header h1{margin:0 0 3px; font-size:16px; font-weight:700}
  header .sub{color:var(--muted); font-size:11.5px}
  .wrap{flex:1; display:flex; min-height:0}
  .stage{flex:1; position:relative; min-width:0}
  canvas#gl{width:100%; height:100%; display:block; cursor:grab} canvas#gl:active{cursor:grabbing}
  .side{width:300px; border-left:1px solid var(--edge); background:var(--panel); padding:13px; overflow-y:auto; display:flex; flex-direction:column; gap:13px}
  .lab{font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--dim); margin-bottom:5px}
  .seg{display:flex; gap:5px; flex-wrap:wrap}
  .seg button{flex:1; min-width:0; background:var(--panel2); border:1px solid var(--edge); color:var(--muted); border-radius:8px; padding:8px 0; font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600; cursor:pointer}
  .seg button.on{background:linear-gradient(180deg,#20304a,#182338); border-color:var(--gold); color:var(--gold)}
  .tog{display:flex; gap:6px}
  .tog button{flex:1; padding:9px 0; font-size:12.5px; font-weight:600; border-radius:8px; border:1px solid var(--edge); background:var(--panel2); color:var(--muted); cursor:pointer}
  .tog button.onN{background:rgba(91,147,255,.15); border-color:var(--blue); color:var(--blue)}
  .tog button.onB{background:rgba(255,107,107,.15); border-color:var(--red); color:var(--red)}
  .ctrl{display:flex; gap:7px; align-items:center}
  button.pl{background:var(--panel2); border:1px solid var(--edge); color:var(--ink); border-radius:8px; padding:8px 12px; font-size:12.5px; cursor:pointer}
  input[type=range]{width:100%; accent-color:var(--gold)}
  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .tile{background:var(--panel2); border:1px solid var(--edge); border-radius:10px; padding:9px 10px}
  .tile .t{font-size:9.5px; color:var(--dim); text-transform:uppercase} .tile .v{font-size:18px; font-weight:600; font-family:"IBM Plex Mono",monospace; margin-top:2px}
  .tile.hl .v{color:var(--gold)}
  .chart{border:1px solid var(--edge); border-radius:10px; background:var(--panel2); padding:8px}
  canvas#fe{width:100%; height:120px; display:block}
  .lg{font-size:10.5px; color:var(--muted); line-height:1.7}
  .lg .sw{display:inline-block; width:11px; height:11px; border-radius:50%; vertical-align:-1px; margin-right:5px}
</style>
<header>
  <h1>Ex3 실측 — SC I-O 발화 구름 + fEPSP (전체망)</h1>
  <div class="sub">세기(fiber volley) 선택 · <b>정상/억제차단</b> 토글 → 발화 뉴런 구름 + 3전극 fEPSP가 자극 후 전개. 실측 데이터.</div>
</header>
<div class="wrap">
  <div class="stage"><canvas id="gl"></canvas></div>
  <div class="side">
    <div>
      <div class="lab">fiber volley (세기 %)</div>
      <div class="seg" id="vol"></div>
    </div>
    <div>
      <div class="lab">억제 조건</div>
      <div class="tog" id="tog">
        <button data-c="normal">정상 (억제 O)</button>
        <button data-c="block">억제 차단</button>
      </div>
    </div>
    <div>
      <div class="lab">재생 · 시간 <span id="tnow" class="mono" style="float:right;color:var(--gold)">0 ms</span></div>
      <div class="ctrl"><button class="pl" id="play" style="flex:1">⏸ 일시정지</button><button class="pl" id="rot" style="flex:1">↻ 회전</button></div>
      <input type="range" id="seek" min="0" max="79" value="0" style="margin-top:8px">
    </div>
    <div class="tiles">
      <div class="tile hl"><div class="t">발화 뉴런</div><div class="v" id="nf">0</div></div>
      <div class="tile"><div class="t">섬유</div><div class="v" id="fb">0</div></div>
    </div>
    <div class="chart">
      <div class="lab" style="margin-bottom:2px">전극 fEPSP (µV) · <span style="color:var(--e1)">E1</span> <span style="color:var(--e2)">E2</span> <span style="color:var(--e3)">E3</span></div>
      <canvas id="fe"></canvas>
    </div>
    <div class="lg">
      <div><span class="sw" style="background:var(--gold)"></span>발화 뉴런 (자극 후)</div>
      <div><span class="sw" style="background:#33405a"></span>정지 뉴런</div>
      <div><span class="sw" style="background:var(--gold);border-radius:2px"></span>⚡ SC 자극(뒤) · 전극 E1/E2/E3(앞)</div>
    </div>
  </div>
</div>

const gl=document.getElementById('gl'), gx=gl.getContext('2d');
const fe=document.getElementById('fe'), fx=fe.getContext('2d');
const N=D.ncell, POS=D.pos, ISPC=D.ispc, EL=D.elec, NF=D.nf, T=D.t, CONDS=D.conds;
const ECOL=['#ffd43b','#c084fc','#2dd4bf'];
const LAYFILL={SO:'rgba(221,132,82,.09)',SP:'rgba(76,114,176,.10)',SR:'rgba(85,168,104,.09)',SLM:'rgba(129,114,179,.09)'};
const LAYINK={SO:'#DD8452',SP:'#6f9bd8',SR:'#55A868',SLM:'#a78bfa'};
let frame=0, facc=0, playing=true, autorot=false, yaw=0.62, pitch=0.16, drag=false, lx=0, ly=0, DPR=Math.min(2,devicePixelRatio||1);
let curVol=50, curCond='normal', firefr=new Int16Array(N).fill(-1), selC=null;
const span=Math.max(D.box.u,D.box.r,D.box.w)*1.12;
const volleys=[...new Set(CONDS.map(c=>c.volley))].sort((a,b)=>a-b);

function resize(){DPR=Math.min(2,devicePixelRatio||1);
  let r=gl.getBoundingClientRect(); gl.width=r.width*DPR; gl.height=r.height*DPR;
  let r2=fe.getBoundingClientRect(); fe.width=r2.width*DPR; fe.height=r2.height*DPR;}
function proj(p,W,H,sc){const cY=Math.cos(yaw),sY=Math.sin(yaw),cP=Math.cos(pitch),sP=Math.sin(pitch);
  let X=p[0],Y=p[1],Z=p[2]; let x1=X*cY-Z*sY,z1=X*sY+Z*cY; let y1=Y*cP-z1*sP,z2=Y*sP+z1*cP;
  const f=900/(900+z2); return [W/2+x1*f*sc,H/2+y1*f*sc,z2,f];}

function selectCond(){
  selC=CONDS.find(c=>c.volley===curVol && c.cond===curCond) || CONDS[0];
  firefr.fill(-1);
  for(const [ci,fr] of selC.fired) firefr[ci]=fr;
  document.getElementById('nf').textContent=selC.nfired+' ('+Math.round(100*selC.nfired/N)+'%)';
  document.getElementById('fb').textContent=Math.round(curVol/100*10000).toLocaleString();
  [...document.getElementById('vol').children].forEach(b=>b.classList.toggle('on',+b.dataset.v===curVol));
  const tg=document.getElementById('tog').children;
  tg[0].className=curCond==='normal'?'onN':''; tg[1].className=curCond==='block'?'onB':'';
}
function drawScene(W,H,sc){
  const bu=D.box.u/2,br=D.box.r/2,bw=D.box.w/2;
  for(const L of (D.layers||[])){const c=[[-bu,L.r0,bw],[bu,L.r0,bw],[bu,L.r1,bw],[-bu,L.r1,bw]].map(p=>proj(p,W,H,sc));
    gx.fillStyle=LAYFILL[L.name]||'rgba(120,130,150,.05)'; gx.beginPath(); c.forEach((q,i)=>i?gx.lineTo(q[0],q[1]):gx.moveTo(q[0],q[1])); gx.closePath(); gx.fill();
    const lb=proj([-bu,(L.r0+L.r1)/2,bw],W,H,sc); gx.fillStyle=LAYINK[L.name]; gx.font='bold 12px IBM Plex Mono'; gx.textAlign='right'; gx.fillText(L.name,lb[0]-5,lb[1]+4); gx.textAlign='left';}
  const cor=[]; for(const su of[-bu,bu])for(const sr of[-br,br])for(const sw of[-bw,bw])cor.push([su,sr,sw]);
  const ed=[[0,1],[0,2],[0,4],[1,3],[1,5],[2,3],[2,6],[3,7],[4,5],[4,6],[5,7],[6,7]];
  gx.strokeStyle='rgba(150,175,210,.3)'; gx.lineWidth=1; for(const [a,b] of ed){const pa=proj(cor[a],W,H,sc),pb=proj(cor[b],W,H,sc); gx.beginPath();gx.moveTo(pa[0],pa[1]);gx.lineTo(pb[0],pb[1]);gx.stroke();}
  if(D.stim_locus){const q=proj(D.stim_locus,W,H,sc); gx.strokeStyle='#ffc857';gx.lineWidth=2;gx.beginPath();gx.arc(q[0],q[1],7,0,6.28);gx.stroke();
    gx.fillStyle='#ffc857';gx.font='bold 11px IBM Plex Mono';gx.fillText('⚡SC',q[0]+10,q[1]+4);}
}
function draw3d(){
  const W=gl.width/DPR,H=gl.height/DPR; gx.setTransform(DPR,0,0,DPR,0,0); gx.clearRect(0,0,W,H);
  const sc=Math.min(W,H)/(span*1.15);
  if(autorot&&!drag) yaw+=0.0022;
  drawScene(W,H,sc);
  const ord=[]; for(let i=0;i<N;i++){const q=proj(POS[i],W,H,sc); ord.push([q[2],i,q]);} ord.sort((a,b)=>a[0]-b[0]);
  for(const [,i,q] of ord){
    const ff=firefr[i]; const lit=ff>=0&&ff<=frame; const f=q[3];
    if(lit){const age=frame-ff; const pulse=age<3?1:0.7; const r=(2.0+2.0*f)*(0.85+0.3*pulse);
      gx.fillStyle='rgba(255,200,87,'+(0.55+0.4*pulse).toFixed(2)+')'; gx.beginPath();gx.arc(q[0],q[1],r,0,6.28);gx.fill();}
    else{gx.fillStyle='rgba(70,90,125,'+(0.28+0.22*f).toFixed(2)+')'; gx.beginPath();gx.arc(q[0],q[1],1.3+1.1*f,0,6.28);gx.fill();}
  }
  for(let j=0;j<EL.length;j++){const q=proj(EL[j],W,H,sc); const vv=selC?selC.V[j][frame]:0;
    const rr=Math.max(2.0,(D.elec_diam||10)/2*sc*q[3]); const glow=Math.min(9,Math.abs(vv)/90);
    gx.fillStyle=vv<0?'rgba(74,144,255,.28)':'rgba(255,85,85,.28)'; gx.beginPath();gx.arc(q[0],q[1],rr+glow,0,6.28);gx.fill();
    gx.fillStyle=ECOL[j]; gx.beginPath();gx.arc(q[0],q[1],rr,0,6.28);gx.fill(); gx.strokeStyle='#fff';gx.lineWidth=1;gx.stroke();
    gx.fillStyle=ECOL[j];gx.font='bold 10px IBM Plex Mono';gx.textAlign='center';gx.fillText(D.enames[j].split('(')[0],q[0],q[1]-rr-glow-4);}
  gx.textAlign='left';
}
function drawFe(){
  const W=fe.width/DPR,H=fe.height/DPR; fx.setTransform(DPR,0,0,DPR,0,0); fx.clearRect(0,0,W,H);
  if(!selC) return; const P={l:30,r:6,t:6,b:16};
  let vmax=1e-6; for(let j=0;j<3;j++)for(const x of selC.V[j])vmax=Math.max(vmax,Math.abs(x));
  const px=f=>P.l+f/(NF-1)*(W-P.l-P.r); const py=v=>H-P.b-((v+vmax)/(2*vmax))*(H-P.t-P.b);
  fx.strokeStyle='rgba(120,150,190,.14)';fx.beginPath();fx.moveTo(P.l,py(0));fx.lineTo(W-P.r,py(0));fx.stroke();
  let f0=0; for(let f=0;f<NF;f++){if(T[f]>=0){f0=f;break;}}
  fx.strokeStyle='rgba(255,200,87,.5)';fx.setLineDash([3,3]);fx.beginPath();fx.moveTo(px(f0),P.t);fx.lineTo(px(f0),H-P.b);fx.stroke();fx.setLineDash([]);
  for(let j=0;j<3;j++){fx.strokeStyle=ECOL[j];fx.lineWidth=1.6;fx.beginPath();for(let f=0;f<NF;f++){const X=px(f),Y=py(selC.V[j][f]);f?fx.lineTo(X,Y):fx.moveTo(X,Y);}fx.stroke();}
  fx.strokeStyle='rgba(255,255,255,.55)';fx.lineWidth=1;fx.beginPath();fx.moveTo(px(frame),P.t);fx.lineTo(px(frame),H-P.b);fx.stroke();
  fx.fillStyle='#5a6a84';fx.font='8px IBM Plex Mono';fx.fillText(vmax.toFixed(0),1,P.t+7);
}
function loop(){ if(playing){facc+=0.5; while(facc>=1){frame=(frame+1)%NF; facc-=1;}}
  draw3d(); drawFe(); document.getElementById('tnow').textContent=T[frame].toFixed(1)+' ms'; document.getElementById('seek').value=frame;
  requestAnimationFrame(loop); }
// UI
const volEl=document.getElementById('vol');
volleys.forEach(v=>{const b=document.createElement('button');b.textContent=v+'%';b.dataset.v=v;b.onclick=()=>{curVol=v;selectCond();};volEl.appendChild(b);});
document.getElementById('tog').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;curCond=b.dataset.c;selectCond();});
document.getElementById('play').onclick=function(){playing=!playing;this.textContent=playing?'⏸ 일시정지':'▶ 재생';};
document.getElementById('rot').onclick=function(){autorot=!autorot;this.style.color=autorot?'#ffc857':'';};
document.getElementById('seek').oninput=function(){frame=+this.value;playing=false;document.getElementById('play').textContent='▶ 재생';};
gl.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;}); window.addEventListener('mouseup',()=>drag=false);
window.addEventListener('mousemove',e=>{if(!drag)return;yaw+=(e.clientX-lx)*0.008;pitch=Math.max(-0.5,Math.min(1.0,pitch+(e.clientY-ly)*0.006));lx=e.clientX;ly=e.clientY;});
window.addEventListener('resize',resize);
resize(); curVol=volleys.includes(50)?50:volleys[0]; selectCond(); loop();
</script>
