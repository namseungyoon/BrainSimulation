<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ex3 I-O 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{ --bg:#080b12; --panel:#0f141f; --panel2:#141b28; --edge:#243044; --ink:#e7eef7; --muted:#8697b0; --dim:#5a6a84;
    --gold:#ffc857; --e1:#ffd43b; --e2:#c084fc; --e3:#2dd4bf; --blue:#5b93ff; --red:#ff6b6b; }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:14px; display:flex; flex-direction:column; height:100vh; overflow:hidden; -webkit-font-smoothing:antialiased}
  .mono{font-family:"IBM Plex Mono",monospace; font-variant-numeric:tabular-nums}
  header{padding:11px 20px 9px; border-bottom:1px solid var(--edge); background:linear-gradient(180deg,var(--panel),var(--panel2))}
  header h1{margin:0 0 3px; font-size:16px; font-weight:700}
  header .sub{color:var(--muted); font-size:11.5px}
  .wrap{flex:1; display:flex; min-height:0}
  .stage{flex:1; position:relative; min-width:0}
  canvas#gl{width:100%; height:100%; display:block; cursor:grab} canvas#gl:active{cursor:grabbing}
  .side{width:300px; border-left:1px solid var(--edge); background:var(--panel); padding:13px; overflow-y:auto; display:flex; flex-direction:column; gap:13px}
  .lab{font-size:10px; text-transform:uppercase; letter-spacing:.7px; color:var(--dim); margin-bottom:5px}
  .seg{display:flex; gap:5px; flex-wrap:wrap}
  .seg button{flex:1; min-width:0; background:var(--panel2); border:1px solid var(--edge); color:var(--muted); border-radius:8px; padding:8px 0; font-family:"IBM Plex Mono",monospace; font-size:12px; font-weight:600; cursor:pointer}
  .seg button.on{background:linear-gradient(180deg,#20304a,#182338); border-color:var(--gold); color:var(--gold)}
  .tog{display:flex; gap:6px}
  .tog button{flex:1; padding:9px 0; font-size:12.5px; font-weight:600; border-radius:8px; border:1px solid var(--edge); background:var(--panel2); color:var(--muted); cursor:pointer}
  .tog button.onN{background:rgba(91,147,255,.15); border-color:var(--blue); color:var(--blue)}
  .tog button.onB{background:rgba(255,107,107,.15); border-color:var(--red); color:var(--red)}
  .ctrl{display:flex; gap:7px; align-items:center}
  button.pl{background:var(--panel2); border:1px solid var(--edge); color:var(--ink); border-radius:8px; padding:8px 12px; font-size:12.5px; cursor:pointer}
  input[type=range]{width:100%; accent-color:var(--gold)}
  .tiles{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .tile{background:var(--panel2); border:1px solid var(--edge); border-radius:10px; padding:9px 10px}
  .tile .t{font-size:9.5px; color:var(--dim); text-transform:uppercase} .tile .v{font-size:18px; font-weight:600; font-family:"IBM Plex Mono",monospace; margin-top:2px}
  .tile.hl .v{color:var(--gold)}
  .chart{border:1px solid var(--edge); border-radius:10px; background:var(--panel2); padding:8px}
  canvas#fe{width:100%; height:120px; display:block}
  .lg{font-size:10.5px; color:var(--muted); line-height:1.7}
  .lg .sw{display:inline-block; width:11px; height:11px; border-radius:50%; vertical-align:-1px; margin-right:5px}
</style>
<header>
  <h1>Ex3 실측 — SC I-O 발화 구름 + fEPSP (전체망)</h1>
  <div class="sub">세기(fiber volley) 선택 · <b>정상/억제차단</b> 토글 → 발화 뉴런 구름 + 3전극 fEPSP가 자극 후 전개. 실측 데이터.</div>
</header>
<div class="wrap">
  <div class="stage"><canvas id="gl"></canvas></div>
  <div class="side">
    <div>
      <div class="lab">fiber volley (세기 %)</div>
      <div class="seg" id="vol"></div>
    </div>
    <div>
      <div class="lab">억제 조건</div>
      <div class="tog" id="tog">
        <button data-c="normal">정상 (억제 O)</button>
        <button data-c="block">억제 차단</button>
      </div>
    </div>
    <div>
      <div class="lab">재생 · 시간 <span id="tnow" class="mono" style="float:right;color:var(--gold)">0 ms</span></div>
      <div class="ctrl"><button class="pl" id="play" style="flex:1">⏸ 일시정지</button><button class="pl" id="rot" style="flex:1">↻ 회전</button></div>
      <input type="range" id="seek" min="0" max="79" value="0" style="margin-top:8px">
    </div>
    <div class="tiles">
      <div class="tile hl"><div class="t">발화 뉴런</div><div class="v" id="nf">0</div></div>
      <div class="tile"><div class="t">섬유</div><div class="v" id="fb">0</div></div>
    </div>
    <div class="chart">
      <div class="lab" style="margin-bottom:2px">전극 fEPSP (µV) · <span style="color:var(--e1)">E1</span> <span style="color:var(--e2)">E2</span> <span style="color:var(--e3)">E3</span></div>
      <canvas id="fe"></canvas>
    </div>
    <div class="lg">
      <div><span class="sw" style="background:var(--gold)"></span>발화 뉴런 (자극 후)</div>
      <div><span class="sw" style="background:#33405a"></span>정지 뉴런</div>
      <div><span class="sw" style="background:var(--gold);border-radius:2px"></span>⚡ SC 자극(뒤) · 전극 E1/E2/E3(앞)</div>
    </div>
  </div>
</div>

function loop(){ if(playing){facc+=0.5; while(facc>=1){frame=(frame+1)%NF; facc-=1;}}
  draw3d(); drawFe(); document.getElementById('tnow').textContent=T[frame].toFixed(1)+' ms'; document.getElementById('seek').value=frame;
  requestAnimationFrame(loop); }
// UI
const volEl=document.getElementById('vol');
volleys.forEach(v=>{const b=document.createElement('button');b.textContent=v+'%';b.dataset.v=v;b.onclick=()=>{curVol=v;selectCond();};volEl.appendChild(b);});
document.getElementById('tog').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;curCond=b.dataset.c;selectCond();});
document.getElementById('play').onclick=function(){playing=!playing;this.textContent=playing?'⏸ 일시정지':'▶ 재생';};
document.getElementById('rot').onclick=function(){autorot=!autorot;this.style.color=autorot?'#ffc857':'';};
document.getElementById('seek').oninput=function(){frame=+this.value;playing=false;document.getElementById('play').textContent='▶ 재생';};
gl.addEventListener('mousedown',e=>{drag=true;lx=e.clientX;ly=e.clientY;}); window.addEventListener('mouseup',()=>drag=false);
window.addEventListener('mousemove',e=>{if(!drag)return;yaw+=(e.clientX-lx)*0.008;pitch=Math.max(-1.5,Math.min(1.55,pitch+(e.clientY-ly)*0.006));lx=e.clientX;ly=e.clientY;});
window.addEventListener('resize',resize);
resize(); curVol=volleys.includes(50)?50:volleys[0]; selectCond(); loop();
</script>
