<title>CA1 Connection Bench</title>
<style>
  :root{
    --bg:#f6f7fb;--panel:#fff;--ink:#1a2130;--mut:#5d6b82;--line:#e4e9f2;--grid:#eef2f8;
    --dep:#3b82f6;--fac:#ef4444;--neu:#94a3b8;--exc:#e11d48;--inh:#334155;
    --post:#7c3aed;--pre:#0e9f6e;--empty:#eceff5;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0e1220;--panel:#161c2c;--ink:#e7ecf5;--mut:#94a3b8;--line:#26304a;--grid:#1b2337;
    --dep:#60a5fa;--fac:#f87171;--neu:#64748b;--exc:#fb7185;--inh:#cbd5e1;
    --post:#a78bfa;--pre:#34d399;--empty:#1b2337;
  }}
  :root[data-theme="dark"]{
    --bg:#0e1220;--panel:#161c2c;--ink:#e7ecf5;--mut:#94a3b8;--line:#26304a;--grid:#1b2337;
    --dep:#60a5fa;--fac:#f87171;--neu:#64748b;--exc:#fb7185;--inh:#cbd5e1;--post:#a78bfa;--pre:#34d399;--empty:#1b2337;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,"Malgun Gothic",sans-serif}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 16px 40px}
  h1{font-size:19px;margin:0 0 2px}
  header p{margin:0;color:var(--mut);font-size:12.5px}
  .prog{height:7px;border-radius:99px;background:var(--grid);margin:10px 0 4px;overflow:hidden}
  .prog>i{display:block;height:100%;background:linear-gradient(90deg,var(--dep),var(--fac));width:0}
  .grid2{display:grid;grid-template-columns:1fr 400px;gap:16px;margin-top:12px}
  @media(max-width:900px){.grid2{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;font-size:10.5px}
  th.col{height:80px;vertical-align:bottom;padding:0 0 5px} th.col div{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap;font-weight:600}
  th.row{text-align:right;padding:0 7px;white-space:nowrap;font-weight:600}
  th.corner{color:var(--mut);font-size:10px;text-align:right;padding:4px}
  td{width:27px;height:27px;text-align:center;border:1px solid var(--grid);font-size:8px;position:relative}
  td.hit{cursor:pointer;color:#fff;font-weight:700} td.hit:hover{outline:2px solid var(--ink);outline-offset:-2px}
  td.sel{outline:2px solid var(--ink);outline-offset:-2px}
  td.empty{background:var(--empty)}
  .bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 8px}
  button{font:inherit;font-size:11.5px;padding:4px 10px;border-radius:99px;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
  button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .detail h3{margin:0 0 2px;font-size:15px} .detail .sub{color:var(--mut);font-size:12px;margin-bottom:8px}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;margin:8px 0}
  .kv .k{color:var(--mut)} .kv b{font-variant-numeric:tabular-nums}
  .big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .tag{display:inline-block;padding:1px 7px;border-radius:99px;font-size:11px;font-weight:600;color:#fff}
  svg{display:block;width:100%;height:auto}
  .lg{font-size:11px;color:var(--mut);margin-top:8px;display:flex;gap:12px;flex-wrap:wrap}
  .lg .sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
  .empty-note{color:var(--mut);font-size:13px;padding:30px 10px;text-align:center}
</style>

<div class="wrap">
  <header>
    <h1>CA1 연결 벤치 — 2세포 uPSP/PPR</h1>
    <p>실제 커넥텀 연결쌍을 격리 측정 (pre IClamp 발화 → post Vm). 셀 클릭 → 파형·지표. 색=PPR(억압↔촉진), 진하기=|uPSP|.</p>
  </header>
  <div class="prog"><i id="pbar"></i></div>
  <div style="font-size:12px;color:var(--mut)"><b id="ndone">0</b>/132 완료</div>

  <div class="bar" style="margin-top:10px">
    <button class="on" id="all" onclick="setCls('all')">전체</button>
    <button onclick="setCls('E1')">E1</button><button onclick="setCls('E2')">E2</button>
    <button onclick="setCls('I1')">I1</button><button onclick="setCls('I2')">I2</button><button onclick="setCls('I3')">I3</button>
  </div>

  <div class="grid2">
    <div class="card scroll"><table id="tbl"></table>
      <div class="lg">
        <span><span class="sw" style="background:var(--dep)"></span>PPR&lt;1 억압</span>
        <span><span class="sw" style="background:var(--fac)"></span>PPR&gt;1 촉진</span>
        <span><span class="sw" style="background:var(--empty)"></span>미측정</span>
      </div>
    </div>
    <div class="card detail" id="detail"><div class="empty-note">완료된 셀을 클릭하면<br>파형과 uPSP/PPR이 나옵니다.</div></div>
  </div>
</div>

<script>
const D=__DATA__;
const CCOL={E1:'--fac',E2:'--fac',I1:'--dep',I2:'--dep',I3:'--dep'};
let curCls='all', sel=null;
function cv(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
// 다중 ISI 배열 → 스칼라 정규화 (실측=pprs_meas 우선, ISI 50 기준)
D.pairs.forEach(p=>{ if(p.pprs){ const j=p.isis.indexOf(50)>=0?p.isis.indexOf(50):1;
  const meas=p.pprs_meas||p.pprs; p.ppr=meas[j]; p.a1=p.a1s[0]; p.a2=p.a2s[j]; p.isi=p.isis[j]; } });
const bykey={}; D.pairs.forEach(p=>bykey[p.pre+'|'+p.post]=p);
function plot(W,H,pl,pb,xs,series,y1line,labels){
  const allY=[].concat(...series.map(s=>s.y)).concat(y1line?[1]:[]);
  let ymax=Math.max(...allY)*1.08, ymin=Math.min(...allY)*0.94; if(ymax-ymin<0.2){ymax+=0.1;ymin-=0.1;}
  const xmin=Math.min(...xs),xmax=Math.max(...xs);
  const sx=x=>pl+(x-xmin)/(xmax-xmin||1)*(W-pl-8), sy=y=>H-pb-(y-ymin)/(ymax-ymin||1)*(H-pb-10);
  let out='';
  if(y1line){const Y=sy(1);out+=`<line x1="${pl}" y1="${Y.toFixed(1)}" x2="${W-8}" y2="${Y.toFixed(1)}" stroke="${cv('--mut')}" stroke-width=".7" stroke-dasharray="3 3" opacity=".6"/><text x="2" y="${(Y+3).toFixed(1)}" font-size="8" fill="${cv('--mut')}">1</text>`;}
  series.forEach(s=>{let d='';s.y.forEach((y,i)=>{const X=sx(xs[i]),Y=sy(y);d+=(i?'L':'M')+X.toFixed(1)+' '+Y.toFixed(1);});
    out+=`<path d="${d}" fill="none" stroke="${s.col}" stroke-width="${s.w||1.5}"${s.dash?' stroke-dasharray="4 3"':''}/>`;
    if(s.dot) s.y.forEach((y,i)=>out+=`<circle cx="${sx(xs[i]).toFixed(1)}" cy="${sy(y).toFixed(1)}" r="2.6" fill="${s.col}"/>`);});
  out+=xs.map(x=>`<text x="${sx(x).toFixed(1)}" y="${H-5}" font-size="8.5" fill="${cv('--mut')}" text-anchor="middle">${x}</text>`).join('');
  (labels||[]).forEach((L,i)=>out+=`<text x="${W-8}" y="${12+i*12}" font-size="9" fill="${L.col}" text-anchor="end">${L.t}</text>`);
  return `<svg viewBox="0 0 ${W} ${H}">`+out+`</svg>`;
}
function stpSVG(p){ if(!p.pprs) return '';
  const s=[]; if(p.pprs_tm) s.push({y:p.pprs_tm,col:cv('--mut'),w:1.3,dash:true});
  s.push({y:p.pprs_meas||p.pprs,col:cv('--ink'),w:1.6,dot:true});
  return plot(376,104,34,20,p.isis,s,true,[{t:'실측',col:cv('--ink')},{t:'TM예측',col:cv('--mut')}]); }
function trainSVG(p){ if(!p.train20) return '';
  const xs=p.train20.map((_,i)=>i+1);
  return plot(376,104,28,20,xs,[{y:p.train20,col:p.train20[p.train20.length-1]<1?cv('--dep'):cv('--fac'),w:1.6,dot:true}],true,[{t:'20Hz train',col:cv('--ink')}]); }

// 축: pre(세로)=SC 제외, post(가로)
const lorder=['SP','SO','SR','SLM'];
const inh=D.nodes.filter(n=>n.ei==='I').sort((a,b)=>(lorder.indexOf(a.layer)-lorder.indexOf(b.layer))||(b.n-a.n));
const preList=['SP_PC',...inh.map(n=>n.id)];
const postList=['SP_PC',...inh.map(n=>n.id)];
const info={}; D.nodes.forEach(n=>info[n.id]=n);
let maxA=0.1; D.pairs.forEach(p=>maxA=Math.max(maxA,Math.abs(p.a1||0)));

function pprCol(ppr){ // 억압(파랑) ↔ 촉진(빨강), 1 근처 회색
  if(ppr==null||isNaN(ppr)) return cv('--neu');
  return ppr<1?cv('--dep'):cv('--fac');
}
function alpha(a){return 0.25+0.75*Math.min(1,Math.abs(a)/maxA);}
function hexA(hex,a){hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');
  const r=parseInt(hex.slice(0,2),16),g=parseInt(hex.slice(2,4),16),b=parseInt(hex.slice(4,6),16);return `rgba(${r},${g},${b},${a.toFixed(2)})`;}

function build(){
  const t=document.getElementById('tbl'); t.innerHTML='';
  const hr=document.createElement('tr');
  const cn=document.createElement('th');cn.className='corner';cn.innerHTML='post→<br>pre↓';hr.appendChild(cn);
  postList.forEach(pm=>{const th=document.createElement('th');th.className='col';const d=document.createElement('div');d.textContent=pm.replace('_','·');d.style.color=info[pm].ei==='E'?cv('--exc'):cv('--inh');th.appendChild(d);hr.appendChild(th);});
  t.appendChild(hr);
  preList.forEach(rm=>{
    const tr=document.createElement('tr');
    const rh=document.createElement('th');rh.className='row';rh.textContent=rm.replace('_','·');rh.style.color=info[rm].ei==='E'?cv('--exc'):cv('--inh');tr.appendChild(rh);
    postList.forEach(cm=>{
      const td=document.createElement('td'); const p=bykey[rm+'|'+cm];
      if(!p){ td.className='empty'; }
      else if(p.ppr==null){ td.className='empty'; td.title=rm+'→'+cm+' (연결없음/미측정)'; }
      else {
        td.className='hit'; if(curCls!=='all'&&p.cls!==curCls){td.style.opacity=.12;}
        td.style.background=hexA(pprCol(p.ppr),alpha(p.a1));
        td.textContent=isNaN(p.ppr)?'-':p.ppr.toFixed(1);
        td._p=p; td.onclick=()=>select(p,td);
        if(p.rep){td.style.boxShadow='inset 0 0 0 2.5px '+cv('--syn');td.title='⭐ 대표: '+(p.ref||'');}
        if(sel&&sel.pre===rm&&sel.post===cm)td.classList.add('sel');
      }
      tr.appendChild(td);
    });
    t.appendChild(tr);
  });
  const nd=D.pairs.filter(p=>p.ppr!=null).length;
  document.getElementById('ndone').textContent=nd;
  document.getElementById('pbar').style.width=(100*nd/132).toFixed(1)+'%';
}

function traceSVG(p){
  const W=376,H=120,pad=24;
  const t=p.t, v=p.v, pr=p.preV;
  const t0=t[0],t1=t[t.length-1];
  function sx(x){return pad+(x-t0)/(t1-t0)*(W-pad-6);}
  function line(arr,vmin,vmax,col,h0,hh){
    let d='';for(let i=0;i<arr.length;i++){const x=sx(t[i]);const y=h0+hh-(arr[i]-vmin)/(vmax-vmin||1)*hh;d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1);}
    return `<path d="${d}" fill="none" stroke="${col}" stroke-width="1.6"/>`;}
  const vmin=Math.min(...v),vmax=Math.max(...v), pmin=Math.min(...pr),pmax=Math.max(...pr);
  const stims=[p.stim,p.stim+p.isi].map(sx);
  const smark=stims.map(x=>`<line x1="${x.toFixed(1)}" y1="0" x2="${x.toFixed(1)}" y2="${H}" stroke="${cv('--mut')}" stroke-width="0.8" stroke-dasharray="2 3" opacity=".5"/>`).join('');
  return `<svg viewBox="0 0 ${W} ${H+94}">`+
    `<text x="2" y="12" font-size="10" fill="${cv('--pre')}">pre Vm (AP)</text>`+
    smark.replace(/y2="120"/g,'y2="70"')+
    line(pr,pmin,pmax,cv('--pre'),16,50)+
    `<text x="2" y="${H-8}" font-size="10" fill="${cv('--post')}">post Vm (${p.mech==='E'?'EPSP':'IPSP'})</text>`+
    `<g transform="translate(0,94)">`+smark.replace(/y2="120"/g,'y2="120"')+line(v,vmin,vmax,cv('--post'),0,110)+`</g>`+
    `</svg>`;
}

function select(p,td){
  sel=p; document.querySelectorAll('td.sel').forEach(x=>x.classList.remove('sel')); td&&td.classList.add('sel');
  const col=pprCol(p.ppr), sign=p.mech==='E'?'EPSP':'IPSP';
  document.getElementById('detail').innerHTML=
    `<h3>${p.pre.replace('_','·')} → ${p.post.replace('_','·')}</h3>`+
    `<div class="sub"><span class="tag" style="background:${p.mech==='E'?cv('--fac'):cv('--dep')}">${p.cls}</span> `+
    `${p.mech==='E'?'흥분':'억제'} · ${p.ns}시냅스 · gsyn ${p.gsyn}nS</div>`+
    `<div style="display:flex;gap:16px;align-items:baseline">`+
      `<div><div class="big" style="color:${col}">${isNaN(p.ppr)?'-':p.ppr.toFixed(2)}</div><div style="font-size:11px;color:var(--mut)">PPR (${p.ppr<1?'억압':'촉진'})</div></div>`+
      `<div><div class="big">${Math.abs(p.a1).toFixed(2)}</div><div style="font-size:11px;color:var(--mut)">u${sign}1 (mV)</div></div>`+
      `<div><div class="big">${Math.abs(p.a2).toFixed(2)}</div><div style="font-size:11px;color:var(--mut)">u${sign}2 (mV)</div></div>`+
    `</div>`+
    (p.rep?`<div style="margin:6px 0 2px;font-size:11px;color:var(--syn);font-weight:600">⭐ 대표 연결 — ${p.ref||''}</div>`:'')+
    `<div style="font-size:11px;color:var(--mut);margin:8px 0 -2px">STP 곡선 (PPR vs ISI) — 실측 vs TM예측</div>`+
    stpSVG(p)+
    (p.train20?`<div style="font-size:11px;color:var(--mut);margin:6px 0 -2px">Train 응답 (20Hz, 진폭 vs 펄스#) — ${p.train20[p.train20.length-1]<1?'저역통과(억압)':'대역통과(촉진)'}</div>`+trainSVG(p):'')+
    `<div style="font-size:11px;color:var(--mut);margin:6px 0 -2px">대표 파형 (ISI ${p.rep_isi||50}ms)</div>`+
    traceSVG(p)+
    `<div class="kv"><span class="k">pre 발화</span><b>${p.presp.toFixed(1)} 회/자극</b>`+
      `<span class="k">기저</span><b>${p.base.toFixed(1)} mV</b>`+
      `<span class="k">잠복 / 상승 / τ</span><b>${p.lat.toFixed(2)} / ${p.rise.toFixed(2)} / ${p.tau.toFixed(1)} ms</b>`+
      `<span class="k">STP U/D/F</span><b>${p.U} / ${p.D} / ${p.F}</b>`+
      `<span class="k">PPR (ISI 20/50/100/200)</span><b>${p.pprs?p.pprs.map(x=>x.toFixed(2)).join(' / '):'-'}</b></div>`+
    (D.example?`<div style="margin-top:8px;font-size:11px;color:var(--fac)">⚠ 예시(Tsodyks-Markram 이론 예측) — 실측 벤치로 교체 예정</div>`:'');
}

function setCls(c){curCls=c;document.querySelectorAll('.bar button').forEach(b=>b.classList.remove('on'));
  (c==='all'?document.getElementById('all'):[...document.querySelectorAll('.bar button')].find(b=>b.textContent===c)).classList.add('on');build();}

build();
// 첫 완료 셀 자동선택
const first=D.pairs.find(p=>p.ppr!=null); if(first) select(first,null);
</script>
