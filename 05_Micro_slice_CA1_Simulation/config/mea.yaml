# MEA 전극 사양 — 단일 출처
# 확정값(사용자 승인) + 배치 상세는 E4b에서 확정.

pitch_um: 200        # 확정 — 전극 간격
diameter_um: 10      # 확정 — 전극 직경
n_electrodes: 3      # 확정 — 2~3개 (800um 축)

# 전극 배치 확정 (2026-08-18, 도구 → config/window_layout.json)
layout:
  arrangement: "3x1"   #   rows x cols. 층관통 세로 = 깊이 프로파일(SO→SP→SR)
  angle_deg: 0
  spacing_um: 200
  stim_id: E3          #   E3(SR) 자극 · E1(SO)/E2(SP) 기록
  center_local_um: {u: -279, r: 53}
  mea_face_w_um: -200  #   전극이 놓이는 잘린 면(표면). 두께 중앙(w=0) 아님 — 실제 MEA는 표면 접촉.
  margin_um: 200       #   조직 가장자리 여유 (기능적 기여 반경 ~200um 근거)
  positions:           #   표면(w=-200) 기준 물리좌표
    - {id: E1, role: rec,  layer: SO, xyz_um: [2959.4, 478.1, 4905.1]}
    - {id: E2, role: rec,  layer: SP, xyz_um: [2930.1, 666.4, 4844.3]}
    - {id: E3, role: stim, layer: SR, xyz_um: [2900.7, 854.6, 4783.4]}
  source: config/window_layout.json

# 세포외 순방향 매질 상수 (Ness 2015 MoI 기본값) — lib/mea_forward 사용
medium:
  sigma_T: 0.3       #   조직 (S/m)
  sigma_S: 1.5       #   식염수
  sigma_G: 0.0       #   유리(MEA면, 절연)
  n_img: 20          #   영상급수 항수
