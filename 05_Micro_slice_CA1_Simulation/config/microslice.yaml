# 마이크로 슬라이스 기하 — 단일 출처 (스크립트 하드코딩 금지, lib 이 여기서 읽음)
# 확정값(사용자 승인)과 파이프라인 유도값(TBD)을 구분한다.

footprint_um:        # 확정 (2026-08-13)
  layer_axis: 800    #   SO/SP/SR 층관통 방향 (전극 2~3개 + 사방 200um 여유)
  perp_axis: 500     #   수직축
thickness_um: 400    # 확정 — 일반 in vitro 급성 슬라이스

# 층 경계 (radial, um) — TBD: Stage4(01_tissue/4_layers) atlas 실측으로 확정
# 참고(like-slice atlas 실측): SO 230 / SP 80 / SR 380 / SLM 199
layers_um:
  SO: null
  SP: null
  SR: null
  SLM: null

# 창 확정 (2026-08-18, 도구로 확정 → config/window_layout.json 이 원본)
window:
  name: 층관통_v1
  size_um:                 # long=proximodistal(종축) · radial=층관통 · thick=두께
    long: 500
    radial: 800
    thick: 400
  angle_deg: 0
  center_local_um: {u: -279, r: 53, w: 0}
  center_xyz_um: [2972.2, 612.2, 4656.4]
  frame:                   # 국소 프레임 (u,r,w → 물리 xyz). Stage5 재구성용.
    seed_um: [2710.38, 505.96, 4628.28]
    long_dir: [-0.96646, -0.20194, -0.15866]
    radial_dir: [-0.1467, 0.9412, -0.30433]
    thick_dir: [0.21079, -0.27085, -0.93926]
  source: config/window_layout.json
