# 5-10 산출 — 엔진 간 첫 펄스 정합 배율. 6단계가 읽는 단일 출처.
#
# 왜 필요한가: 엔진마다 첫 펄스 크기가 다르다. 그대로 비교하면 동역학 차이가 아니라
#   크기 차이를 보게 된다. gmax 에 이 배율을 곱하면 첫 펄스가 기준 엔진과 같아진다.
# 전도도는 gmax 에 정확히 선형이므로 배율은 한 번 재면 확정이다(선형성 검증 포함).
# 기준: A (GBPlasticitySyn) · rho0 0.0 · 클래스 PC->PC · g 0.6 nS · dt 0.025
# 목표 첫 펄스 전도도: 0.596781 nS

reference: A
target_g_nS: 0.596781
base_g_nS: 0.6
dt_ms: 0.025
rho0: 0.0

gmax_scale:
  det: {v: 1.977293, before_pct: -49.426, ref: "방출확률 Use 를 곱하므로 절반에서 출발한다 (BBP 관례)"}
  A: {v: 1.000000, before_pct: +0.000, ref: "기준 엔진"}
  B: {v: 1.000000, before_pct: +0.000, ref: "norm_Pr=1 이 첫 펄스를 A 에 맞춘다 (D24)"}
  C: {v: 1.000000, before_pct: +0.000, ref: "시행평균으로만 정합된다 — 개별 시행은 흩어진다 (D26)"}
  stdp: {v: 0.988647, before_pct: +1.148, ref: "cnexp 라 GB 의 derivimplicit 보다 1.15% 크다 (D27)"}

# 확률 엔진은 평균만 맞는다. 개별 시행 표준편차(목표 대비 %):
