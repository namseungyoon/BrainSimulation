# 04 시냅스 전달 파라미터 — 단일 출처 (3-1 에서 확정, 2026-08-21 / PC->PC 로 정정)
# 각 값에 출처 태그: paper(측정/논문) · ours(우리 선택) · mod(mod 기본값)
# ⚠️ 이 값들은 전달(AMPA/NMDA) 파라미터다. 가소성 엔진별 파라미터는 config/engines.yaml.
#
# 이 벤치는 CA1 추체세포 2개를 붙인 것이다. 따라서 연결은 PC->PC 하나뿐이다.
#   D9(2026-08-21): 이전 버전은 default_class 가 SC->PC 였다. SC->PC 는 Ecker2020 Table3 에
#   존재하지 않는 클래스이고(Table3 = CA1 내부 연결만), 01 트랙에서 "SC 대용"으로 만들어 붙인
#   튜닝값이었다. 04 는 독립 트랙이므로 그 값을 쓸 근거가 없고, 벤치의 실제 연결도 아니다.
#   -> SC->PC 삭제. PC->PC (Ecker2020 Table3 실측 E2 클래스) 하나만 남긴다.

default_class: PC->PC

classes:
  PC->PC:                         # CA1 추체세포 -> CA1 추체세포 (Ecker2020 Table3 "PC->PC (E2)", 억압형)
    receptor: AMPANMDA
    g_nS:        {v: 0.6,   src: paper, ref: "Ecker2020 Table3 PC->PC(E2) g_hat. 3-7 에서 uEPSP 기준 재보정"}
    e_rev_mV:    {v: -8.5,  src: paper, ref: "Moradi & Ascoli 2020 유효 역전위(§2.6). mod 기본 0 을 덮어씀"}
    tau_r_AMPA:  {v: 0.2,   src: paper, ref: "Ecker2020 Table3 (E 계열)"}
    tau_d_AMPA:  {v: 3.0,   src: paper, ref: "Ecker2020 Table3 PC->PC(E2) tau_d"}
    tau_r_NMDA:  {v: 3.9,   src: paper, ref: "Ecker2020 §2.3 PC->PC NMDA (Q10 보정, 34도). D11"}
    tau_d_NMDA:  {v: 148.5, src: paper, ref: "Ecker2020 §2.3 PC->PC NMDA (Q10 보정, 34도). D11"}
    NMDA_ratio:  {v: 1.22,  src: paper, ref: "Ecker2020 §2.3 PC->PC NMDA:AMPA"}
    mg_mM:       {v: 1.0,   src: mod,   ref: "생리 세포외 Mg2+"}
    # 단기가소성(TM) — Ecker2020 Table3 실측값 (억압형: Fac < Dep)
    Use:         {v: 0.50,  src: paper, ref: "Ecker2020 Table3. ⚠️HippocampusHub 는 0.65±0.1 — DECISIONS 미결#2"}
    Dep_ms:      {v: 671.0, src: paper, ref: "Ecker2020 Table3 PC->PC(E2)"}
    Fac_ms:      {v: 17.0,  src: paper, ref: "Ecker2020 Table3 PC->PC(E2). Fac<Dep -> 억압"}
    Nrrp:        {v: 2,     src: paper, ref: "Ecker2020 Table3 PC->PC(E2) 방출자리 수"}

notes:
  - "★ D11 (NMDA 동역학 확정): tau_r/tau_d = 3.9 / 148.5 ms (Ecker2020 §2.3, PC->PC, Q10 보정).
     우리 h.celsius = 34.0 이 Ecker 시뮬 온도와 같아 보정값을 그대로 쓴다.
     이전 값 9.0/61.0 은 출처가 'Andrasfalvy & Magee 2001' 로 적혀 있었으나 그 논문
     (PMID 11717348)은 제목이 'Distance-dependent increase in AMPA receptor number...' 이고
     Schaffer collateral 경로의 AMPA 수용체 개수를 다룬다. NMDA 시상수의 출처가 아니며
     우리 연결(PC->PC)도 아니다 -> 잘못된 인용이었다(Sayer1990 과 같은 SC 오염).
     ⚠️ 파생: NMDA 감쇠가 61 -> 148.5ms 로 약 2.4배 길어져 NMDA 전하량이 크게 늘어난다.
     5단계 칼슘 기반 가소성 문턱은 이 값 위에서 잡아야 한다(5-1 에서 반영)."
  - "칼슘 지연 D(13.7 vs 18.8ms)·이중안정 파라미터는 전달이 아니라 가소성 소관 -> 5-1 에서 확정."
  - "e_rev=-8.5 는 GB mod 기본 e=0 을 덮어써야 한다. 시냅스 생성 시 syn.e=-8.5 명시."
  - "촉진형 대조가 필요해지면 Ecker Table3 의 실측 촉진 클래스(PC->SOM+ E1: Use 0.09/Dep 138/Fac 670)를
     쓴다. 없는 클래스를 만들어 쓰지 않는다."
