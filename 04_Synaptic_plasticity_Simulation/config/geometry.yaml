# 04 벤치 확정 기하 — 3-2 에서 고정 (2026-08-21). 이후 모든 단계가 이 값을 재현한다.
# ⚠️ 이 파일을 바꾸면 3-2 를 다시 돌려 시냅스 위치·지연을 재생성해야 한다.
# 근거: docs/DECISIONS.md D8 (방사축 정렬 + 회전각 탐색)

fixed: true                 # 기하 고정됨. 배치 탐색을 다시 하지 않는다.

pair:
  pre_bundle:  CA1_pyr_cACpyr_oh140807_A0_idF_20190305115459_model_files
  post_bundle: CA1_pyr_cACpyr_oh140807_A0_idC_20190305103627_model_files
  pre_tag:  oh140807_A0_idF
  post_tag: oh140807_A0_idC

placement:
  # 두 세포를 정단(방사)축 +y 로 정렬 후 소마를 측방으로 L 만큼 벌리고,
  # pre 를 방사축 둘레로 best_angle 회전 → 접촉 최대 (3-2 탐색 결과)
  radial_axis: apical_plus_y     # 04는 아틀라스 미로드 → 세포 정단축을 방사축 대응물로
  soma_lateral_L_um: 120.0
  pre_rotation_deg: 160.0        # θ* (접촉 최대)
  touch_r_um: 10.0

sr_band_um: [100.0, 300.0]       # post 정단수상돌기 SR 대역 (시냅스 배치 구간)

conduction:
  v_cond_um_per_us: 0.5          # 전도속도 0.5 m/s (CA3 SC 무수초 근사)
  syn_delay_ms: 0.5              # 시냅스 지연 (전도지연에 더함)

# 확정 시냅스 5개 — post 세포의 구획·경로거리·전도지연.
# 각 시냅스는 해당 apic 구획의 (0.5) 위치에 놓는다.
synapses:
  - {section: "apic[21]",  path_um: 178.1, dist3d_um: 109.8, delay_ms: 0.72, touch_um: 7.4}
  - {section: "apic[109]", path_um: 206.6, dist3d_um: 144.3, delay_ms: 0.79, touch_um: 8.5}
  - {section: "apic[36]",  path_um: 218.6, dist3d_um: 173.2, delay_ms: 0.85, touch_um: 18.1}
  - {section: "apic[37]",  path_um: 225.1, dist3d_um: 178.9, delay_ms: 0.86, touch_um: 16.5}
  - {section: "apic[29]",  path_um: 239.2, dist3d_um: 147.7, delay_ms: 0.80, touch_um: 9.2}
